# Builds the Windows election app (TCC-Election.exe).
# Download it from the run's "Artifacts" section on the Actions page (sign in to GitHub first).
name: Build election app (Windows)

on:
  push:
    branches: [main]
    paths: ["election/**", ".github/workflows/election-app.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyinstaller==6.11.1 openpyxl==3.1.5 pywebview==5.3.2
      - name: Get cloudflared (for the internet link)
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/download/2024.10.1/cloudflared-windows-amd64.exe" -OutFile election/cloudflared.exe
      - name: Build exe
        working-directory: election
        run: pyinstaller --noconfirm --onefile --windowed --name TCC-Election --add-data "web;web" --add-binary "cloudflared.exe;." --hidden-import openpyxl app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TCC-Election
          path: |
            election/dist/TCC-Election.exe
            election/README.md
