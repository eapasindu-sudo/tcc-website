# Publishes the website on GitHub Pages and keeps the Facebook news up to date.
# Runs on every push to main, every 2 hours, and on demand (Actions -> Run workflow).
name: Update Facebook posts and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Facebook posts
        # If Facebook fails (e.g. expired token), still publish the site with the last saved posts
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_TOKEN" ]; then
            echo "Facebook secrets not set yet - keeping the current data/posts.json"
          else
            node scripts/fetch-facebook.mjs
          fi

      - name: Save new posts to the repository
        run: |
          git config user.name "facebook-sync"
          git config user.email "facebook-sync@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || (git commit -m "Update Facebook posts [skip ci]" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
